# Builds the app and publishes dist/ to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is still set to "Deploy from a branch", GitHub also publishes the raw
      # repository on every push, and whichever deploy finishes last is what's live.
      # Wait for that one so the built app always lands on top.
      - name: Wait for GitHub's branch deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            state=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | if length == 0 then "none" elif all(.status == "completed") then "done" else "running" end')
            echo "branch deploy: $state"
            if [ "$state" = done ]; then break; fi
            if [ "$state" = none ] && [ "$i" -ge 6 ]; then break; fi
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
