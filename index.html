<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reel Room</title>
    <meta name="description" content="Turn your camera roll into beat-synced Instagram Reels. Finds your best moments, pulls music from any video and cuts on the beat." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&family=Anton&family=Instrument+Serif:ital@0;1&family=Caveat:wght@700&family=Tinos:ital,wght@0,400;1,400&display=swap"
    />
  </head>
  <body>
    <!-- boot -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: #0f1014; color: #f0ece6; font: 15px/1.45 -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif; text-align: center; }
      .boot-mark { display: flex; align-items: flex-end; gap: 4px; height: 28px; }
      .boot-mark span { width: 7px; border-radius: 2px; background: linear-gradient(100deg, #ffc27a, #ff6f8a); animation: boot-pulse 0.9s ease-in-out infinite alternate; }
      .boot-mark span:nth-child(1) { height: 15px; }
      .boot-mark span:nth-child(2) { height: 28px; animation-delay: 0.15s; }
      .boot-mark span:nth-child(3) { height: 20px; animation-delay: 0.3s; }
      .boot p { margin: 0; max-width: 34ch; }
      .boot .boot-detail { color: #aaa6ae; font-size: 13px; overflow-wrap: anywhere; }
      .boot button { margin-top: 6px; padding: 10px 18px; border: 0; border-radius: 10px; background: #ffb36b; color: #22130b; font: 600 15px/1 inherit; }
      @keyframes boot-pulse { to { opacity: 0.45; } }
    </style>
    <div id="root"><div class="boot" id="boot" role="status"><div class="boot-mark" aria-hidden="true"><span></span><span></span><span></span></div><p id="boot-msg">Loading Reel Room…</p></div></div>
    <script>
      // Until the app replaces #boot, show any startup failure on screen instead of a blank page.
      (function () {
        var shown = false;
        function show(title, detail) {
          var boot = document.getElementById("boot");
          if (!boot || shown) return;
          shown = true;
          boot.setAttribute("role", "alert");
          boot.innerHTML = "";
          var t = document.createElement("p");
          t.textContent = title;
          boot.appendChild(t);
          if (detail) {
            var d = document.createElement("p");
            d.className = "boot-detail";
            d.textContent = detail;
            boot.appendChild(d);
          }
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = "Reload";
          b.onclick = function () { location.reload(); };
          boot.appendChild(b);
        }
        window.addEventListener("error", function (e) {
          show("Reel Room couldn't start in this browser.", (e && e.message) || "Unknown error");
        });
        setTimeout(function () {
          show("Reel Room is taking a long time to load.", "Check your connection and reload. If you opened it from your home screen, try the same link in Safari.");
        }, 20000);
      })();
    </script>
    <!-- /boot -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
