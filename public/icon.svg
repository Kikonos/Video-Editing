<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Reel Room: a vertical reel with the 16:9 film band and the beat. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c37"/>
      <stop offset="1" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc27a"/>
      <stop offset="0.55" stop-color="#ff8f6b"/>
      <stop offset="1" stop-color="#ff6f8a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd8a0"/>
      <stop offset="0.6" stop-color="#ff9a70"/>
      <stop offset="1" stop-color="#e8587a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff9a70" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff9a70" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="band"><rect x="277" y="376" width="470" height="264"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect x="277" y="94" width="470" height="836" rx="64" fill="#050507"/>
  <rect x="277" y="94" width="470" height="836" rx="64" fill="none" stroke="#3a3c48" stroke-width="10"/>
  <rect x="392" y="318" width="240" height="20" rx="10" fill="#f0ece6"/>
  <g clip-path="url(#band)">
    <rect x="277" y="376" width="470" height="264" fill="url(#sky)"/>
    <circle cx="512" cy="538" r="74" fill="#fff1d6"/>
    <rect x="277" y="538" width="470" height="102" fill="#3b2a52"/>
    <rect x="432" y="558" width="160" height="12" rx="6" fill="#ffb36b" opacity="0.9"/>
    <rect x="466" y="588" width="92" height="10" rx="5" fill="#ffb36b" opacity="0.6"/>
  </g>
  <rect x="418" y="724" width="30" height="66" rx="15" fill="url(#sun)"/>
  <rect x="497" y="694" width="30" height="126" rx="15" fill="url(#sun)"/>
  <rect x="576" y="712" width="30" height="90" rx="15" fill="url(#sun)"/>
</svg>
